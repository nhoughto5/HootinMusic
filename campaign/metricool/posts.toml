# Hootin EP: every feed post, ready for Metricool.
#
# This is the only place feed captions live. Edit them here, then build the
# import file:
#     python campaign/metricool/build_csv.py
# See it all, with the clip checklist, on a live page:
#     python campaign/metricool/preview.py
# The kickoff-day steps are in ../marketing-plan.md.
#
# Placeholders, in captions and titles:
#   [EP TITLE]  the EP's title, from [release] below
#   [DATE]      the release date, written like "Friday, March 5"
#   [LINK]      "link in bio" on Instagram, TikTok and YouTube;
#               the HyperFollow link itself on Facebook, where links are clickable
#
# Each post:
#   day       Mon to Sun of that week. Release day (R) is a Friday.
#   type      "video" (the default) or "image". Image posts skip YouTube.
#   clip_url  the clip's Google Drive share link: shared as "Anyone with the
#             link" with Editor access
#   title     the YouTube title for videos (100 characters max), or the
#             TikTok title for images (90 max)
#   time      optional; overrides the default time in [release]
#   clip      how to make the clip: which parts of which video, and the steps.
#             Only the preview reads it. Some clips also have:
#               record  what you record yourself for it: a phone video, a
#                       voice-over or a demo
#               say     what to say in that recording

[release]
date = ""         # the release Friday, written as 2027-03-05
ep_title = ""
link = ""         # the DistroKid HyperFollow link
time = "18:00"    # when posts go out, in the brand's time zone in Metricool
brand = ""        # leave empty unless the Metricool account has more than one brand
youtube_tags = "Hootin,new music,indie music"

# The 9:16 music videos the clips are cut from, relative to campaign/videos/.
# The Horizontal/ versions are the same edit, with the same times.
[videos]
"Faster Than Slow" = "Vertical/FasterThanSlow_Vertical.mp4"
"Old Glitch" = "Vertical/Old_Glitch_Insta.mp4"
"Stay Deranged" = "Vertical/StayDeranged_Insta.mp4"
"Seasons" = "Vertical/Seasons_Vertical.mp4"

# Goes for every clip. The preview shows these at the top.
[clips]
every = [
  "Cut from the 9:16 version of the video. The times here come from a rough transcription, so nudge each cut to land on a beat or the start of a line.",
  "Export 1080×1920 MP4 (H.264), with AAC audio at 128 kbps or lower. Instagram rejects anything higher.",
  "Keep text out of the bottom fifth of the frame and off the right edge, where Instagram and TikTok put the caption and buttons.",
  "Lyric captions mean the sung words on screen as they're sung. Most people scroll with the sound off.",
  "No dates, EP title or links on screen unless they're settled when you make the clip. The captions carry those.",
  "Name each file after its post, like “R-4 Wed.mp4”, so it's easy to match up.",
]
# Goes for the posts with a `record`: phone videos, voice-overs and demos.
recording = [
  "Record them all in one sitting. It's about an evening's work.",
  "Phone videos: vertical, on the phone's main (back) camera, propped at eye level. Face a window for light, in a quiet room with fans and music off.",
  "Check the background before you film: no photos of your daughter, and nothing with her name on it.",
  "Read the “What to say” points, then say them in your own words. Don't read them out. Do two or three takes and keep the most natural one.",
  "Start talking straight away, with no “hi” or “so”. The first second decides whether people keep watching.",
  "Voice-overs: your studio mic, or a phone voice memo held close, in a quiet room. Leave a second of silence before and after.",
  "Your own voice only, never text-to-speech.",
  "Put the files in campaign/videos/Recorded/, named after the post, like “R-5 Mon.mov” or “R-4 Wed voice.wav”. Claude cuts them in and times captions to what you say.",
]


# ---------------------------------------------------------------- R-5
[[week]]
week = -5
focus = "The story"
hashtags = "#newmusic #indieartist #comingsoon"

[[week.post]]
day = "Mon"
name = "The story"
clip_url = ""
title = "Four new songs, finally finished | Hootin"
caption = """
Before my daughter was born, I was finishing four songs. The plan was to put them out when she arrived.

She had other plans and showed up six weeks early. The songs sat unfinished while life got very full.

They're finally done. [EP TITLE], four new songs, out [DATE].

Pre-save: [LINK]
"""

[week.post.clip]
record = "Phone video of you, talking to the camera"
say = [
  "These four songs were supposed to come out over a year ago.",
  "I was finishing them while we were waiting for my daughter. The plan was to put them out when she arrived.",
  "She had other plans, and showed up six weeks early. The songs sat unfinished while life got very full.",
  "They're finally done. Four new songs, coming soon, and I'd love for you to hear them.",
]
parts = [{ video = "Faster Than Slow", start = "0:04", end = "0:10" }]
steps = [
  "You, telling the story, 30–45 seconds. Captions on screen of what you say.",
  "Then cut to the sunrise (part 1) for the last few seconds and let the song come in, with the text “4 new songs. Coming soon.”",
  "If you'd rather not be on camera: record the same lines as a voice-over over Faster Than Slow 0:00–0:24, with the song turned down underneath.",
]

[[week.post]]
day = "Wed"
name = "Teaser"
clip_url = ""
title = "Four songs. One release. [DATE] | Hootin"
caption = """
Four songs. One release. [DATE].

A sunrise. A bar on a space station. A quiet song that turns into a rock anthem. A drive out of a hard season.

Pre-save: [LINK]
"""

[week.post.clip]
parts = [
  { video = "Faster Than Slow", start = "1:16", end = "1:23" },
  { video = "Old Glitch", start = "0:49", end = "0:56" },
  { video = "Stay Deranged", start = "3:28", end = "3:35" },
  { video = "Seasons", start = "1:25", end = "1:32" },
]
steps = [
  "Join the four parts in this order, with a hard cut on the beat between each.",
  "Each song's title on screen for its part: Faster Than Slow, Old Glitch, Stay Deranged, Seasons.",
  "End card, 2 seconds: “4 new songs. Coming soon.” Add the EP title if it's settled.",
  "This teaser is used four times with a different end card each time: here, R-1 Fri, R Fri and R+1 Tue. Edit it once and export four versions.",
]

[[week.post]]
day = "Fri"
name = "How to help"
clip_url = ""
title = "How to pre-save the new Hootin songs"
caption = """
If you've ever wanted to help a small artist, pre-saving is the easiest way. It takes about ten seconds.

Open the pre-save link, pick the app you listen on, and the songs show up in your library on [DATE]. That's it, and it genuinely helps.

Pre-save: [LINK]
"""

[week.post.clip]
record = "Voice-over"
say = [
  "If you've ever wanted to help a small artist, pre-saving is the easiest way.",
  "Tap the link, pick the app you listen on, and the songs land in your library on release day.",
  "That's it. It takes ten seconds.",
]
parts = [{ video = "Old Glitch", start = "1:49", end = "2:08" }]
steps = [
  "The “automatic” section (“Our machines will serve you”), with the bar shots. It suits a how-to.",
  "Your voice over the clip, with the song turned down underneath. Bring the song back up once you've finished.",
  "Captions on screen of what you say.",
]


